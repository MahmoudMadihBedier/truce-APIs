name: Scheduled Scrape Refresh

on:
  schedule:
    # Runs every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scraping API
        run: |
          curl -X POST "${{ secrets.API_BASE_URL }}/api/scrape" \
               -H "x-scrape-secret: ${{ secrets.SCRAPE_SECRET }}" \
               -v
